spring:
  application:
    name: instadino-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  # a pilha de execução e a mensagem de erro nunca são enviadas ao cliente
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: 64KB
  max-http-request-header-size: 16KB
  servlet:
    session:
      cookie:
        http-only: true
        secure: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

instadino:
  dados: ${INSTADINO_DADOS_BACKEND:./dados-backend}
